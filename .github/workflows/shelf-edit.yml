name: Shelf edit

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  edit:
    # The repo is public, so issues from anyone but you are ignored.
    if: contains(github.event.issue.labels.*.name, 'shelf-edit') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python -m pipeline.issue_edit
      - name: Commit, close issue, rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.apply.outputs.result }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/shelf.json
          git diff --cached --quiet || git commit -m "Shelf edit: $RESULT"
          git pull --rebase --autostash || true
          git push
          gh issue comment ${{ github.event.issue.number }} --body "$RESULT. The site refreshes in a few minutes."
          gh issue close ${{ github.event.issue.number }}
          gh workflow run update.yml
